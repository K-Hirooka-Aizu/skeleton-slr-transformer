name: Reproduction Report
description: Report problems reproducing the results in the paper, or unexpected results
title: "[Repro] "
labels: ["reproducibility", "bug"]

body:
  - type: textarea
    id: issue
    attributes:
      label: Issue Description
      placeholder: Describe the problem you are facing.
    validations:
      required: true

  - type: textarea
    id: result_gap
    attributes:
      label: Expected vs Actual
      placeholder: |
        Paper: XX.X%
        Actual: XX.X%
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Download dataset ...
        2. Run command: python scripts/train.py ...
    validations:
      required: true

  - type: input
    id: dataset
    attributes:
      label: Dataset
      placeholder: e.g. WLASL100

  - type: input
    id: config
    attributes:
      label: Configuration (Hydra)
      placeholder: e.g. data=wlasl100 model=postnorm_transformer seed=42

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 22.04
        Python: 3.10
        PyTorch: 2.7.1
        CUDA: 12.8 / RTX 3090
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context (optional)
      placeholder: Any other information or observations.
