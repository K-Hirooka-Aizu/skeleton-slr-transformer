name: Feature / Improvement
description: Suggest a new feature or an improvement to the project
title: "[Feat] "
labels: ["enhancement"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Proposal Summary
      placeholder: Briefly describe what you would like to propose.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      placeholder: Why is this needed, and what are the benefits?
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Plan (optional)
      placeholder: Describe how it could be implemented, if you have an idea.
