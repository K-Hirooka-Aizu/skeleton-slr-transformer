name: Bug Report
description: Report a bug to help us improve the project
title: "[BUG] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      placeholder: |
        1. Prepare dataset '...'
        2. Run command 'python scripts/train.py ...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 22.04
        Python: 3.10
        PyTorch: 2.7.1
        CUDA: 12.8 / RTX 3090

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots