name: Question / Discussion
description: Ask about implementation details or the method described in the paper
title: "[Question] "
labels: ["question", "discussion"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: Briefly describe your question.
    validations:
      required: true

  - type: input
    id: section
    attributes:
      label: Related Section of the Paper (optional)
      placeholder: e.g. Section 3.2

  - type: input
    id: equation
    attributes:
      label: Equation (optional)
      placeholder: e.g. Eq. (4)

  - type: input
    id: file
    attributes:
      label: Related File (optional)
      placeholder: e.g. src/sstan/models/transformers/postnorm_transformer.py

  - type: input
    id: lines
    attributes:
      label: Lines (optional)
      placeholder: e.g. 45-50

  - type: textarea
    id: details
    attributes:
      label: Details
      placeholder: Describe the background and what you have already tried.
    validations:
      required: true
